html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 56.25vw; display: block; }
#panel { position: fixed; right: 12px; top: 12px; bottom: 12px; width: 280px; display: flex; flex-direction: column; gap: 8px; padding: 12px;
  box-sizing: border-box; background: #24002a; color: #fae6d2; border: 1px solid #a8742a; border-radius: 8px; font: 14px/1.3 system-ui, sans-serif; }
#panel[hidden] { display: none; }
#panel h1 { margin: 0; font-size: 14px; font-weight: 600; }
#panel input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; background: #fff8ee; color: #24002a; border: 0; border-radius: 4px; font-size: 15px; }
#panel button { padding: 8px; border: 1px solid #a8742a; border-radius: 4px; background: #4a0848; color: #fae6d2; font: inherit; cursor: pointer; text-align: left; }
#panel button:hover { background: #6d1262; }
#panel button.on { background: #e2ac4a; color: #24002a; }
#row { display: flex; gap: 8px; }
#row button { flex: 1; text-align: center; }
#list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
#panel small { opacity: .75; }
</style>

  const m = ctx.measureText("Hxg");
  const y = BAR_TOP + BAR_H / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2 - 1;
  const grad = ctx.createLinearGradient(0, y - size, 0, y + size * .3);
  grad.addColorStop(0, "rgb(255,240,222)");
  grad.addColorStop(1, "rgb(246,206,158)");
  return { size, letters, y, n: chars.length, squeeze, grad };
}

function drawCentred(im, x, y, scale, deg) {
  ctx.save();
  ctx.translate(x, y);
  if (deg) ctx.rotate(deg * Math.PI / 180);
  ctx.scale(scale, scale);
  ctx.drawImage(im, -im.width / 2, -im.height / 2);
  ctx.restore();
}

function drawName() {
  const l = lay;
  ctx.font = fontStr(l.size);
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = l.grad;
  for (const c of l.letters) {
    const start = 1.62 + 0.70 * c.i / Math.max(l.n - 1, 1);
    const p = prog(k, start, start + 0.52);
    if (p <= 0) continue;
    ctx.globalAlpha = Math.min(p * 2.2, 1);
    const x = c.x - (1 - easeOut(p, 3.2)) * 26;
    if (l.squeeze < 1) {
      ctx.save(); ctx.translate(x, l.y); ctx.scale(l.squeeze, 1); ctx.fillText(c.ch, 0, 0); ctx.restore();
    } else ctx.fillText(c.ch, x, l.y);
  }
  ctx.globalAlpha = 1;
}

const shimmerC = document.createElement("canvas");
shimmerC.width = 1920; shimmerC.height = 200;
const sctx = shimmerC.getContext("2d");

function drawShimmer() {
  const s = prog(k, 2.45, 2.98);
  if (s <= 0 || s >= 1) return;
  const xc = TEXT_X0 + (TEXT_X1 - TEXT_X0 + 120) * easeIO(s, 1.8) - 60;
  const yTop = BAR_TOP - 60;
  sctx.clearRect(0, 0, 1920, 200);
  sctx.globalCompositeOperation = "source-over";
  sctx.font = fontStr(lay.size);
  sctx.fillStyle = "rgb(255,220,160)";
  for (const c of lay.letters) {
    if (lay.squeeze < 1) { sctx.save(); sctx.translate(c.x, lay.y - yTop); sctx.scale(lay.squeeze, 1); sctx.fillText(c.ch, 0, 0); sctx.restore(); }
    else sctx.fillText(c.ch, c.x, lay.y - yTop);
  }
  const g = sctx.createLinearGradient(xc - 90, 0, xc + 90, 0);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.5, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
  sctx.globalCompositeOperation = "destination-in";
  sctx.fillStyle = g;
  sctx.fillRect(0, 0, 1920, 200);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.24 * Math.sin(s * Math.PI);
  ctx.drawImage(shimmerC, 0, yTop);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, 1920, 1080);
  if (k <= 0) return;

  // 1. The bar pushes out from behind the circle. The pattern stays fixed on the cloth.
  const e = easeIO(prog(k, 0.85, 1.85), 3.2);
  if (e > 0) {
    const xe = CX + (BAR_END - CX) * e, rnd = BAR_H / 2;
    const shape = () => {
      ctx.beginPath();
      ctx.moveTo(CX - 2, CY - rnd);
      ctx.lineTo(xe - rnd, CY - rnd);
      ctx.arc(xe - rnd, CY, rnd, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(CX - 2, CY + rnd);
      ctx.closePath();
    };
    ctx.save();
    ctx.shadowColor = "rgba(10,0,12,.40)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 7;
    ctx.fillStyle = "#2c002c"; shape(); ctx.fill();
    ctx.restore();
    ctx.save(); shape(); ctx.clip();
    ctx.drawImage(img.bar, CX, BAR_TOP - 4);
    ctx.restore();
    // the thread under the bar draws on just after it
    const g = easeIO(prog(k, 1.05, 2.0), 2.2);
    if (g > 0) {
      const lw = ((BAR_END - rnd * 0.55) - CX) * g;
      const lg = ctx.createLinearGradient(CX + lw - 18, 0, CX + lw, 0);
      lg.addColorStop(0, "rgba(255,164,28,1)"); lg.addColorStop(1, "rgba(255,164,28,0)");
      ctx.fillStyle = lg;
      ctx.fillRect(CX, BAR_TOP + BAR_H + 3, lw, 5);
    }
  }
  // 2 and 3. Name letter by letter, then one shimmer
  drawName();
  drawShimmer();
  // 4. The bloom on the bar's end opens as the bar arrives
  const b = easeBack(prog(k, 1.62, 2.1), 1.9);
  if (b > 0) drawCentred(img.bloom, BAR_END - 22, CY, Math.max(b, .02), (1 - b) * 110);
  // 5. The circle rolls in like a wheel, with a small overshoot
  const r = easeBack(prog(k, 0, 0.85), 1.35);
  if (r > 0) {
    const x = -R * 1.8 + (CX + R * 1.8) * r;
    drawCentred(img.face, x, CY, 1, 0);
    const a = easeOut(prog(k, 0.55, 1.0), 2.6);
    if (a > 0) {
      const sc = 0.86 + 0.14 * a;
      const w = img.diya.width * sc, h = img.diya.height * sc;
      const sx = x - w * .5, sy = CY - h * .32 + 14;
      ctx.globalAlpha = a;
      ctx.drawImage(img.diya, sx, sy, w, h);
      ctx.globalAlpha = 1;
      const pw = easeBack(prog(k, 0.8, 1.25), 2.0);
      if (pw > 0) {
        const n = Math.floor(flameT / FLAME.loop * FLAME.frames) % FLAME.frames;
        const sxF = (n % FLAME.cols) * FLAME.size, syF = Math.floor(n / FLAME.cols) * FLAME.size;
        const s = FLAME.size * pw;
        ctx.drawImage(img.flame, sxF, syF, FLAME.size, FLAME.size,
          sx + WICK[0] * sc - s / 2, sy + WICK[1] * sc - FLAME.ay * pw, s, s);
      }
    }
    ctx.save();
    ctx.shadowColor = "rgba(10,0,12,.42)"; ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;
    drawCentred(img.ring, x, CY, 1, (1 - r) * 300);
    ctx.restore();
  }
}

function step(dt) {
  flameT = (flameT + dt) % (FLAME.loop * 1000);
  if (dir > 0) {
    k += dt;
    if (k >= IN_S) { k = IN_S; dir = 0; holdLeft = holdS; }
  } else if (dir < 0) {
    k -= dt;
    if (k <= 0) {
      k = 0; dir = 0;
      if (pending !== null) { applyName(pending); pending = null; dir = 1; }
      else if (looping) gap = 1;
    }
  } else if (k >= IN_S && holdLeft !== Infinity) {
    holdLeft -= dt;
    if (holdLeft <= 0) dir = -1;
  } else if (gap > 0) {
    gap -= dt;
    if (gap <= 0) dir = 1;
  }
}

function applyName(text) { name = text; lay = layout(name); markList(); }

function take(text) {
  if (k <= 0 && dir === 0) { applyName(text); dir = 1; }
  else { pending = text; dir = -1; }
}

// The API: lowerThird.in(), .out(), .replay(), .take("Name"), .set({name, hold})
window.lowerThird = {
  in() { dir = 1; },
  out() { pending = null; if (k > 0) dir = -1; },
  replay() { k = 0; pending = null; dir = 1; },
  take,
  set(o) { if (o.name !== undefined) applyName(String(o.name)); if (o.hold !== undefined) holdS = o.hold === "inf" ? Infinity : +o.hold; },
  state() { return { k, dir, name, size: lay && lay.size, squeeze: lay && lay.squeeze, holdLeft, pending }; },
  freeze(atK, atFlame) { frozen = true; k = atK; flameT = atFlame || 0; dir = 0; draw(); },
  unfreeze() { frozen = false; },
  step(dt) { step(dt); draw(); },
};

let last = null;
function tick(now) {
  if (!frozen) {
    // Follow the real clock, so a slow machine drops frames rather than playing in slow motion.
    // Only after a long stall (a hidden tab, say) does it carry on from where it was instead of jumping.
    const dt = last === null ? 0 : Math.min((now - last) / 1000, 1.5);
    step(dt);
    draw();
  }
  last = now;
  requestAnimationFrame(tick);
}

// Operator panel
const panel = document.getElementById("panel");
const listEl = document.getElementById("list");
const typed = document.getElementById("typed");
function markList() { for (const b of listEl.children) b.classList.toggle("on", b.textContent === name); }
function keepChanged() { const on = document.getElementById("keep").checked; holdS = on ? Infinity : 3; if (on) holdLeft = Infinity; else if (k >= IN_S) holdLeft = 3; }
NAMES.forEach(n => {
  const b = document.createElement("button");
  b.textContent = n;
  b.onclick = () => take(n);
  listEl.appendChild(b);
});
document.getElementById("take").onclick = () => { if (typed.value.trim()) take(typed.value.trim()); };
document.getElementById("outb").onclick = () => lowerThird.out();
document.getElementById("keep").onchange = keepChanged;
typed.addEventListener("keydown", e => { if (e.key === "Enter" && typed.value.trim()) take(typed.value.trim()); e.stopPropagation(); });
panel.hidden = !showPanel;
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); dir > 0 || (k > 0 && dir === 0) ? lowerThird.out() : lowerThird.in(); }
  else if (e.key === "r" || e.key === "R") lowerThird.replay();
  else if (e.key === "h" || e.key === "H") panel.hidden = !panel.hidden;
});
// In OBS, showing the source plays it again
addEventListener("obsSourceVisibleChanged", e => { if (e.detail && e.detail.visible) lowerThird.replay(); else { k = 0; dir = 0; } });

async function start() {
  await Promise.all(Object.entries(ASSETS).map(([key, src]) => new Promise((ok, no) => {
    const im = new Image(); im.onload = () => { img[key] = im; ok(); }; im.onerror = no; im.src = src;
  })));
  await document.fonts.load(fontStr(BASE), name);
  await document.fonts.ready;
  lay = layout(name);
  markList();
  if (auto && !showPanel) dir = 1;
  document.documentElement.dataset.ready = "1";
  requestAnimationFrame(tick);
}
start();
</script>
</body>
